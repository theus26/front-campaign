<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/dispara-facil.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automatize e dispare campanhas com inteligência</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <!-- SVG Logo -->
        <svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ícone -->
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4F46E5" />
              <stop offset="100%" stop-color="#6366F1" />
            </linearGradient>
          </defs>

          <!-- Círculo de fundo -->
          <circle cx="40" cy="40" r="30" fill="#1E293B" />

          <!-- Raio -->
          <path d="M35 20 L50 35 L42 35 L55 60 L30 40 L38 40 Z" fill="url(#grad)" />

          <!-- Texto -->
          <text x="85" y="48" font-family="Inter, Arial, sans-serif" font-size="28" fill="#E2E8F0" font-weight="600">
            Dispara<tspan fill="#6366F1">Fácil</tspan>
          </text>
        </svg>
      </div>
      <div class=" loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const loaderColor = localStorage.getItem('vuexy-initial-loader-bg') || '#FFFFFF'
    const primaryColor = localStorage.getItem('vuexy-initial-loader-color') || '#7367F0'

    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

    if (primaryColor)
      document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
  </script>
</body>

</html>
